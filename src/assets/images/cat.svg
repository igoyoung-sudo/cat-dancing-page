<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="70" r="40" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Left ear -->
  <polygon points="70,45 65,20 85,35" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <polygon points="70,45 68,28 80,38" fill="#ffb74d"/>

  <!-- Right ear -->
  <polygon points="130,45 135,20 115,35" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <polygon points="130,45 132,28 120,38" fill="#ffb74d"/>

  <!-- Left eye -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="#fff"/>
  <circle cx="86" cy="68" r="5" fill="#000"/>
  <circle cx="87" cy="66" r="2" fill="#fff"/>

  <!-- Right eye -->
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="#fff"/>
  <circle cx="114" cy="68" r="5" fill="#000"/>
  <circle cx="115" cy="66" r="2" fill="#fff"/>

  <!-- Nose -->
  <polygon points="100,80 95,85 105,85" fill="#f06292"/>

  <!-- Mouth -->
  <path d="M 100 85 Q 90 90 85 85" fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 85 Q 110 90 115 85" fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="50" y1="70" x2="75" y2="72" stroke="#e65100" stroke-width="1.5"/>
  <line x1="50" y1="75" x2="75" y2="75" stroke="#e65100" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="75" y2="78" stroke="#e65100" stroke-width="1.5"/>

  <!-- Whiskers right -->
  <line x1="150" y1="70" x2="125" y2="72" stroke="#e65100" stroke-width="1.5"/>
  <line x1="150" y1="75" x2="125" y2="75" stroke="#e65100" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="125" y2="78" stroke="#e65100" stroke-width="1.5"/>

  <!-- Belly -->
  <ellipse cx="100" cy="130" rx="30" ry="40" fill="#ffcc80"/>

  <!-- Left arm -->
  <ellipse cx="70" cy="120" rx="12" ry="30" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Right arm -->
  <ellipse cx="130" cy="120" rx="12" ry="30" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Left leg -->
  <ellipse cx="85" cy="165" rx="12" ry="20" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <ellipse cx="85" cy="180" rx="14" ry="8" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Right leg -->
  <ellipse cx="115" cy="165" rx="12" ry="20" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <ellipse cx="115" cy="180" rx="14" ry="8" fill="#ff9800" stroke="#e65100" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 145 130 Q 170 120 175 100 Q 180 80 175 60" fill="none" stroke="#ff9800" stroke-width="14" stroke-linecap="round"/>
  <path d="M 145 130 Q 170 120 175 100 Q 180 80 175 60" fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round"/>
</svg>
